[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "microscape"
dynamic = ["version"]
description = "Downstream analysis tools for amplicon sequencing data, designed to work with papa2's output."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    { name = "rec3141" },
]
keywords = ["amplicon", "metagenomics", "16S", "18S", "microbiome"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
bio = [
    "papa2",
    "biopython",
]

[tool.setuptools.packages.find]
include = ["microscape*"]
[project.scripts]
microscape = "microscape.cli:main"

# Version comes from git, not from a string in this file.
#
# It was pinned at "0.1.0" and never moved, so every build of this package reported the
# same version regardless of what was in it — and since microscape-nf installs it with
# `pip install git+https://...`, a pipeline run could not say which code it had. Between
# tags setuptools-scm produces e.g. 0.1.1.dev5+gd9b4645, which carries the commit in the
# version string itself.
#
# Tag a release deliberately (`git tag -a v0.2.0 -m ...`); everything between tags
# increments on its own.
[tool.setuptools_scm]
version_file = "microscape/_version.py"
# pip sometimes clones without tags; fail soft rather than breaking the install.
fallback_version = "0.0.0+unknown"
